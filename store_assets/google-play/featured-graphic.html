<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1024px; height: 500px; margin: 0; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; background: #003c2f; }
    .hero {
      width: 1024px;
      height: 500px;
      position: relative;
      overflow: hidden;
      color: #fff;
      background-image: linear-gradient(90deg, rgba(0, 35, 27, .96) 0%, rgba(0, 60, 47, .84) 39%, rgba(0, 60, 47, .08) 74%), url('featured-background.png');
      background-size: cover;
      background-position: center;
    }
    .content { position: absolute; left: 58px; top: 54px; width: 440px; }
    .logo { width: 108px; height: 108px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    h1 { margin: 26px 0 10px; font-size: 48px; line-height: 1; letter-spacing: -1.4px; }
    h1 span { color: #d4af37; }
    .subtitle { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 600; }
    .pill { display: inline-block; margin-top: 28px; padding: 10px 16px; border: 1px solid #d4af37; border-radius: 999px; color: #f3d878; font-size: 14px; font-weight: 700; letter-spacing: 1.7px; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="content">
      <img class="logo" src="../../assets/branding/autoyaad_icon.png" alt="AutoYaad logo">
      <h1>Auto<span>Yaad</span> CMS</h1>
      <p class="subtitle">Private vehicle publishing and approval</p>
      <div class="pill">POST &nbsp;•&nbsp; APPROVE &nbsp;•&nbsp; MARK SOLD</div>
    </div>
  </section>
</body>
</html>
