name: autoyaad_ghana
description: Managed Ghana vehicle marketplace for cars, motorbikes and commercial vehicles.
publish_to: none
version: 1.1.1+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  cloud_functions: ^5.6.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  google_mobile_ads: ^6.0.0
  http: ^1.4.0
  url_launcher: ^6.3.2
  share_plus: 11.1.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/autoyaad_icon.png
    - assets/branding/autoyaad_splash.png
